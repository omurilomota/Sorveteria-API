# =============================================================================
# Integração contínua
# =============================================================================
#
# O que é: a cada push ou pull request, o GitHub sobe uma máquina limpa, clona o
# repositório, compila e roda os testes. Se algo quebrar, aparece um X vermelho
# no commit.
#
# Por que importa para um portfólio: é a diferença entre "eu digo que funciona"
# e "está provado que funciona, e você pode conferir agora". Quem abre o
# repositório vê o selo verde e o histórico de execuções.
#
# Roda no MESMO Java da aplicação (21), numa máquina vazia. Isso pega um erro
# comum: depender de algo que só existe no seu computador.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          # Temurin é a distribuição do OpenJDK mantida pela Eclipse Foundation
          distribution: "temurin"
          # Guarda o cache do ~/.m2 entre execuções, para não baixar tudo de novo
          cache: maven

      - name: Compilar e rodar os testes
        # --batch-mode: sem cores e animações, para o log ficar legível
        # --no-transfer-progress: sem as barras de download
        #
        # Os testes usam Testcontainers, que precisa do Docker. Os runners do
        # GitHub já têm o Docker disponível, então não é preciso configurar nada.
        run: ./mvnw --batch-mode --no-transfer-progress verify
