spring.application.name=SorveteriaBackend
server.port=8081

# =============================================================================
# Banco de dados: PostgreSQL
# =============================================================================
#
# A sintaxe ${VARIAVEL:valor-padrao} lê a variável de ambiente VARIAVEL e usa o
# que estiver depois dos dois-pontos quando ela não existe.
#
# Serve para duas coisas:
#   1. Você roda local sem configurar nada (usa o padrão);
#   2. Em produção, o host e a senha vêm do ambiente, sem senha escrita no Git.
#
# Nunca deixe senha de produção versionada: qualquer um que ler o repositório
# passa a ter acesso ao banco.
#
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sorveteria}
spring.datasource.username=${DB_USER:sorveteria}
spring.datasource.password=${DB_PASSWORD:sorveteria}

# =============================================================================
# Schema controlado pelo Flyway, não pelo Hibernate
# =============================================================================
#
# validate  -> o Hibernate NÃO mexe no banco. Ele apenas compara as entidades
#              com as tabelas que já existem e falha na inicialização se houver
#              divergência: coluna que falta, nome errado, tipo incompatível.
#
# Isso é de propósito, e é a parte mais útil da configuração: transforma um erro
# silencioso (Hibernate corrigindo o schema sozinho e você sem saber) em um erro
# que aparece na hora de subir a aplicação.
#
spring.jpa.hibernate.ddl-auto=validate

# O Flyway roda as migrações de src/main/resources/db/migration na ordem, antes
# das outras coisas subirem. Ele guarda na tabela flyway_schema_history quais já
# foram aplicadas, então rodar a aplicação de novo não repete nada.
spring.flyway.enabled=true

# =============================================================================
# Log de SQL
# =============================================================================
#
# Ligado de propósito: lendo o SQL que o Hibernate gera, dá para entender o que
# o JPA realmente faz por baixo. Em produção, desligue com JPA_SHOW_SQL=false.
#
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
